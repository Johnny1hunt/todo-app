<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>My Tasks</h1>
    <p class="date" id="today"></p>

    <!-- Add a new task -->
    <form id="taskForm" class="add">
      <input type="text" id="taskInput" placeholder="What do you need to do?" maxlength="100" autocomplete="off" required />
      <button type="submit">Add</button>
    </form>

    <!-- Filter buttons -->
    <div class="filters" id="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>

    <!-- Task list -->
    <ul id="taskList" class="list"></ul>
    <p id="emptyMsg" class="empty">No tasks here. Add one above!</p>

    <!-- Footer info -->
    <div class="footer">
      <span id="counter">0 tasks left</span>
      <button id="clearBtn" class="link">Clear completed</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
